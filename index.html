<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#05080d" />
<title>局域文件分发系统 · LFDS</title>
<style>
:root{
  --bg:#05080d;
  --panel:#0b1018;
  --panel-2:#0e1520;
  --line:rgba(126,166,206,.14);
  --line-2:rgba(126,166,206,.24);
  --txt:#eef5fb;
  --dim:#adc0d4;
  --dim-2:#8d9fb3;
  --accent:#2fd4e8;
  --accent-soft:rgba(47,212,232,.10);
  --ok:#39d98a;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(1100px 560px at 8% -12%,rgba(47,212,232,.10),transparent 62%),
    radial-gradient(900px 520px at 102% -6%,rgba(58,110,255,.09),transparent 58%),
    var(--bg);
  color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
.shell{
  max-width:1080px;
  margin:0 auto;
  padding:26px 18px 40px;
  padding-top:calc(26px + env(safe-area-inset-top));
  padding-bottom:calc(40px + env(safe-area-inset-bottom));
}

/* ---------- header ---------- */
.hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:13px;min-width:0}
.logo{
  width:42px;height:42px;flex:0 0 42px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(47,212,232,.20),rgba(47,212,232,.04));
  border:1px solid rgba(47,212,232,.34);
  color:var(--accent);font-size:20px;line-height:1;
}
h1{margin:0;font-size:21px;letter-spacing:.5px;font-weight:650}
.brand p{
  margin:2px 0 0;font-family:var(--mono);font-size:11.5px;
  letter-spacing:1.6px;color:var(--dim-2);text-transform:uppercase;
}
.status{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:12px;color:var(--dim);
  padding:7px 12px;border:1px solid var(--line);border-radius:999px;
  background:rgba(11,16,24,.7);white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim-2);box-shadow:0 0 0 3px rgba(126,166,206,.10)}
.status.ok .dot{background:var(--ok);box-shadow:0 0 0 3px rgba(57,217,138,.14)}
.status.err .dot{background:#ff6b6b;box-shadow:0 0 0 3px rgba(255,107,107,.16)}

/* ---------- kpi ---------- */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0 16px}
.kpi{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;min-width:0;
}
.kpi .k{display:block;font-size:12px;color:var(--dim-2);letter-spacing:.4px}
.kpi strong{
  display:block;margin-top:4px;font-family:var(--mono);
  font-size:19px;font-weight:600;color:var(--txt);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.kpi.wide{grid-column:1 / -1}
.kpi.wide strong{font-size:13.5px;color:var(--accent);font-weight:500}

/* ---------- panel / list ---------- */
.panel{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
}
.p-hd{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:14px 16px;border-bottom:1px solid var(--line);
}
.p-hd h2{margin:0;font-size:14px;font-weight:600;letter-spacing:.4px}
.btn{
  appearance:none;cursor:pointer;font:inherit;font-size:12.5px;
  color:var(--dim);background:rgba(126,166,206,.06);
  border:1px solid var(--line-2);border-radius:8px;padding:6px 13px;
  transition:color .15s,border-color .15s,background .15s;
}
.btn:hover{color:var(--accent);border-color:rgba(47,212,232,.42);background:var(--accent-soft)}
.btn:active{transform:translateY(1px)}

.list{display:flex;flex-direction:column}
.row{
  display:grid;
  grid-template-columns:46px minmax(0,1fr) auto;
  align-items:center;gap:12px;
  padding:13px 16px;
  border-bottom:1px solid rgba(126,166,206,.09);
  color:inherit;text-decoration:none;
  transition:background .13s;
}
.row:last-child{border-bottom:none}
.row:hover{background:rgba(47,212,232,.055)}
.row:active{background:rgba(47,212,232,.09)}
.tag{
  font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.6px;
  text-align:center;padding:5px 0;border-radius:6px;
  color:#8ecbe0;background:rgba(126,166,206,.10);
  border:1px solid rgba(126,166,206,.16);
  overflow:hidden;white-space:nowrap;
}
.tag.zip,.tag.rar,.tag.x7z{color:#e8c37a;background:rgba(232,195,122,.10);border-color:rgba(232,195,122,.22)}
.tag.exe,.tag.msi,.tag.apk{color:#9fd08a;background:rgba(159,208,138,.10);border-color:rgba(159,208,138,.22)}
.tag.png,.tag.jpg,.tag.jpeg,.tag.webp,.tag.gif{color:#c79ae8;background:rgba(199,154,232,.10);border-color:rgba(199,154,232,.22)}
.tag.pdf,.tag.txt,.tag.md,.tag.json{color:#8ecbe0}
.name{
  font-size:15px;font-weight:520;color:var(--txt);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.meta{
  display:flex;align-items:baseline;gap:14px;
  font-family:var(--mono);font-size:12px;color:var(--dim-2);
  white-space:nowrap;
}
.meta .size{color:var(--dim)}
.meta .ext{color:var(--accent)}
.dl{
  grid-row:1;grid-column:3;align-self:center;
  font-size:12.5px;color:var(--accent);
  border:1px solid rgba(47,212,232,.32);border-radius:7px;
  padding:4px 11px;background:var(--accent-soft);white-space:nowrap;
}
.row:hover .dl{background:rgba(47,212,232,.18);border-color:rgba(47,212,232,.55)}

/* ---------- 手机端：meta 掉到第二行 ---------- */
@media (max-width:640px){
  .row{grid-template-columns:40px minmax(0,1fr) auto;grid-template-areas:"tag name dl" "tag meta dl";row-gap:3px}
  .tag{grid-area:tag;align-self:start;margin-top:2px}
  .name{grid-area:name;font-size:15.5px}
  .meta{grid-area:meta;font-size:12.5px;gap:10px}
  .dl{grid-area:dl;font-size:12px;padding:5px 10px}
  .kpis{grid-template-columns:1fr 1fr}
}

/* ---------- 连接仓库（无需配置文件，推断不出时手输一次） ---------- */
.setup-body{padding:16px}
.setup-hint{margin:0 0 12px;font-size:13px;color:var(--dim-2);line-height:1.6}
.setup-hint code{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.setup-row{display:flex;gap:10px}
.setup-row input{
  flex:1;min-width:0;appearance:none;
  background:#070b11;color:var(--txt);
  border:1px solid var(--line-2);border-radius:8px;
  font-family:var(--mono);font-size:14px;padding:9px 12px;
  outline:none;transition:border-color .15s,box-shadow .15s;
}
.setup-row input:focus{border-color:rgba(47,212,232,.55);box-shadow:0 0 0 3px rgba(47,212,232,.10)}
.setup-row .btn{padding:9px 18px;font-size:13px;color:var(--accent);border-color:rgba(47,212,232,.32);background:var(--accent-soft);white-space:nowrap}
.setup-err{margin:10px 0 0;font-size:12.5px;color:#ff8a8a}
@media (min-width:900px){.setup-hint{font-size:13.5px}.setup-row input{font-size:15px}}
.empty{padding:46px 20px;text-align:center}
.empty p{margin:0;font-size:14px;color:var(--dim)}
.empty .sub{margin-top:6px;font-size:12.5px;color:var(--dim-2)}
.empty code{font-family:var(--mono);font-size:12px;color:var(--accent)}

.ft{
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:16px;font-size:12px;color:var(--dim-2);
}
.ft .mono{font-family:var(--mono)}

/* ---------- 桌面端：小字改实色并统一上调，避免高分屏发虚 ---------- */
@media (min-width:900px){
  body{font-size:16px}
  .shell{padding:34px 26px 46px}
  .brand p{font-size:12.5px;color:#93a8bd}
  .status{font-size:13px;color:#b6c8da}
  .kpis{grid-template-columns:1fr 1fr 1.7fr}
  .kpi.wide{grid-column:auto}
  .kpi .k{font-size:13px;color:#93a8bd}
  .kpi strong{font-size:22px}
  .kpi.wide strong{font-size:14.5px}
  .p-hd h2{font-size:15px}
  .btn{font-size:13.5px}
  .row{grid-template-columns:52px minmax(0,1fr) 246px 96px;padding:15px 20px}
  .tag{font-size:12px;padding:5px 0}
  .name{font-size:16px}
  .meta{font-size:13px;justify-content:flex-end}
  .dl{grid-column:4;font-size:13.5px;text-align:center}
  .ft{font-size:13px;color:#93a8bd}
  .empty p{font-size:15px}
  .empty .sub{font-size:13.5px}
}
</style>
</head>
<body>
<div class="shell">
  <header class="hd">
    <div class="brand">
      <div class="logo">↓</div>
      <div>
        <h1>局域文件分发系统</h1>
        <p>LFDS · Static Host</p>
      </div>
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="statusTxt">读取中</span></div>
  </header>

  <section class="kpis">
    <div class="kpi"><span class="k">文件数</span><strong id="kCount">—</strong></div>
    <div class="kpi"><span class="k">总大小</span><strong id="kSize">—</strong></div>
    <div class="kpi wide"><span class="k">仓库</span><strong id="kRepo">—</strong></div>
  </section>

  <section class="panel" id="setup" hidden>
    <div class="p-hd">
      <h2>连接仓库</h2>
    </div>
    <div class="setup-body">
      <p class="setup-hint">填入公开仓库的 <code>owner/repo</code>，带分支写 <code>owner/repo@分支</code>，也可以直接粘仓库网址。连上后这台设备会记住，不用再填。</p>
      <div class="setup-row">
        <input id="repoInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
        <button class="btn" id="repoSave" type="button">连接</button>
      </div>
      <p class="setup-err" id="repoErr" hidden></p>
    </div>
  </section>
  <section class="panel" id="files" hidden>
    <div class="p-hd">
      <h2>可下载文件</h2>
      <button class="btn" id="reload" type="button">刷新列表</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="empty" hidden>
      <p>dist 目录里还没有文件</p>
      <p class="sub">把文件放进仓库的 <code>dist/</code> 目录，push 后刷新即可</p>
    </div>
    <div class="empty" id="fail" hidden>
      <p id="failTitle">读取 dist 目录失败</p>
      <p class="sub" id="failSub">检查网络后点刷新重试</p>
    </div>
  </section>

  <footer class="ft">
    <span>点击文件名直接下载 · 列表实时读取仓库 dist 目录</span>
    <span class="mono" id="clock"></span>
  </footer>
</div>

<script>
(function () {
  var LS_KEY = 'lfds.repo';
  var DIR = 'dist';
  var API = 'https://api.github.com/repos/';

  var listEl = document.getElementById('list');
  var emptyEl = document.getElementById('empty');
  var failEl = document.getElementById('fail');
  var failTitle = document.getElementById('failTitle');
  var failSub = document.getElementById('failSub');
  var statusEl = document.getElementById('status');
  var statusTxt = document.getElementById('statusTxt');
  var kCount = document.getElementById('kCount');
  var kSize = document.getElementById('kSize');
  var kRepo = document.getElementById('kRepo');
  var clock = document.getElementById('clock');
  var setupEl = document.getElementById('setup');
  var filesEl = document.getElementById('files');
  var repoInput = document.getElementById('repoInput');
  var repoSave = document.getElementById('repoSave');
  var repoErr = document.getElementById('repoErr');

  var target = { owner: '', repo: '', branch: '' };

  function fmtSize(b) {
    if (b < 1024) return b + ' B';
    var u = ['KB', 'MB', 'GB', 'TB'], i = -1;
    do { b /= 1024; i++; } while (b >= 1024 && i < u.length - 1);
    return (b >= 100 ? b.toFixed(0) : b >= 10 ? b.toFixed(1) : b.toFixed(2)) + ' ' + u[i];
  }

  function extOf(name) {
    var i = name.lastIndexOf('.');
    return i > 0 ? name.slice(i + 1).toLowerCase() : 'file';
  }

  function setStatus(cls, txt) {
    statusEl.className = 'status ' + cls;
    statusTxt.textContent = txt;
  }

  function label() {
    return target.owner + '/' + target.repo + (target.branch ? ' @ ' + target.branch : '');
  }

  function safeHref(f) {
    if (f.url) {
      try {
        var u = new URL(f.url, location.href);
        if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
      } catch (e) { /* 非法外链按本地文件处理 */ }
    }
    return DIR + '/' + encodeURIComponent(f.name);
  }

  // ---------- 仓库地址解析：owner/repo[@branch]，也接受仓库网址 ----------
  function parseSpec(raw) {
    var s = String(raw == null ? '' : raw).trim();
    if (!s) return null;
    s = s.replace(/^https?:\/\//i, '').replace(/^www\./i, '').replace(/^github\.com\//i, '');
    s = s.replace(/\.git$/i, '').replace(/[?#].*$/, '').replace(/\/+$/, '');
    var branch = '';
    var at = s.indexOf('@');
    if (at > 0) {
      branch = s.slice(at + 1).trim();
      s = s.slice(0, at);
    }
    var parts = s.split('/').filter(Boolean);
    if (parts.length < 2) return null;
    return { owner: parts[0], repo: parts[1], branch: branch };
  }

  // ---------- 地址推断：页面部署在哪，就知道仓库是谁 ----------
  function detect() {
    var host = location.hostname.toLowerCase();
    var segs = location.pathname.split('/').filter(Boolean);

    var pages = /^([a-z0-9-]+)\.github\.io$/.exec(host);
    if (pages) {
      return segs.length
        ? { owner: pages[1], repo: decodeURIComponent(segs[0]), branch: '' }
        : { owner: pages[1], repo: pages[1] + '.github.io', branch: '' };
    }

    if (/^(cdn|fastly|gcore|testingcf)\.jsdelivr\.net$/.test(host) && segs[0] === 'gh') {
      var ver = String(segs[2] || '').split('@');
      if (segs[1] && ver[0]) {
        return {
          owner: decodeURIComponent(segs[1]),
          repo: decodeURIComponent(ver[0]),
          branch: ver[1] && ver[1] !== 'latest' ? ver[1] : ''
        };
      }
    }

    if (/^raw(git|cdn)?\.githack\.com$/.test(host) && segs.length >= 3) {
      return { owner: segs[0], repo: segs[1], branch: segs[2] };
    }

    return null;
  }

  function recall() {
    try { return parseSpec(localStorage.getItem(LS_KEY)); } catch (e) { return null; }
  }

  function remember() {
    try { localStorage.setItem(LS_KEY, label().replace(/ @ /, '@')); } catch (e) { /* 隐私模式忽略 */ }
  }

  function forget() {
    try { localStorage.removeItem(LS_KEY); } catch (e) { /* 隐私模式忽略 */ }
  }

  // ---------- 取列表 ----------
  function contentsUrl() {
    var u = API + encodeURIComponent(target.owner) + '/' + encodeURIComponent(target.repo) + '/contents/' + DIR;
    return target.branch ? u + '?ref=' + encodeURIComponent(target.branch) : u;
  }

  function fetchFiles() {
    return fetch(contentsUrl(), { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' })
      .then(function (r) {
        if (r.ok) return r.json();
        if (r.status === 404) throw new Error('仓库或 dist 目录不存在（仓库需要公开）');
        if (r.status === 403 || r.status === 429) throw new Error('GitHub API 限流，稍后刷新再试');
        throw new Error('HTTP ' + r.status);
      })
      .then(function (data) {
        if (!Array.isArray(data)) throw new Error('dist 不是一个目录');
        return data
          .filter(function (f) { return f.type === 'file' && f.name.charAt(0) !== '.'; })
          .map(function (f) { return { name: f.name, size: f.size }; });
      });
  }

  // links.json 可选：仓库放不下的大文件用外链补进来
  function loadLinks() {
    return fetch('links.json', { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : []; })
      .catch(function () { return []; });
  }

  function showFail(title, sub) {
    listEl.textContent = '';
    emptyEl.hidden = true;
    failEl.hidden = false;
    failTitle.textContent = title;
    failSub.textContent = sub;
    kCount.textContent = '—';
    kSize.textContent = '—';
  }

  function render(files) {
    listEl.textContent = '';
    failEl.hidden = true;
    emptyEl.hidden = files.length ? true : false;
    kCount.textContent = files.length;
    var total = files.reduce(function (s, f) { return s + (f.size || 0); }, 0);
    kSize.textContent = files.length ? fmtSize(total) : '—';

    files.forEach(function (f) {
      var a = document.createElement('a');
      a.className = 'row';
      a.href = safeHref(f);
      a.setAttribute('download', f.name);

      var tag = document.createElement('span');
      var ext = extOf(f.name);
      tag.className = 'tag ' + (/^[a-z]/.test(ext) ? ext : 'x' + ext);
      tag.textContent = ext.slice(0, 4).toUpperCase();

      var name = document.createElement('span');
      name.className = 'name';
      name.textContent = f.name;
      name.title = f.name;

      var meta = document.createElement('span');
      meta.className = 'meta';
      var size = document.createElement('span');
      size.className = 'size';
      size.textContent = f.size ? fmtSize(f.size) : (f.url ? '外链' : '空文件');
      meta.appendChild(size);
      if (f.url) {
        var extMark = document.createElement('span');
        extMark.className = 'ext';
        extMark.textContent = '外部存储';
        meta.appendChild(extMark);
      }

      var dl = document.createElement('span');
      dl.className = 'dl';
      dl.textContent = '下载';

      a.appendChild(tag);
      a.appendChild(name);
      a.appendChild(meta);
      a.appendChild(dl);
      listEl.appendChild(a);
    });
  }

  function applyFiles(files) {
    return loadLinks().then(function (links) {
      var names = {};
      files.forEach(function (f) { names[f.name] = 1; });
      (Array.isArray(links) ? links : []).forEach(function (l) {
        if (!l || !l.name || !l.url || names[l.name]) return;
        names[l.name] = 1;
        files.push({ name: String(l.name), size: Number(l.size) || 0, url: String(l.url) });
      });
      files.sort(function (a, b) { return a.name.localeCompare(b.name, 'zh'); });
      render(files);
    });
  }

  function showSetup() {
    setupEl.hidden = false;
    filesEl.hidden = true;
    failEl.hidden = true;
    emptyEl.hidden = true;
    listEl.textContent = '';
    kRepo.textContent = '—';
    kCount.textContent = '—';
    kSize.textContent = '—';
    setStatus('', '待连接');
  }

  function load(staleFromStorage) {
    if (!target.owner || !target.repo) {
      showSetup();
      return;
    }
    setupEl.hidden = true;
    filesEl.hidden = false;
    kRepo.textContent = label();
    setStatus('', '读取中');

    fetchFiles()
      .then(applyFiles)
      .then(function () {
        setStatus('ok', label());
        remember();
      })
      .catch(function (e) {
        setStatus('err', '读取失败');
        showFail('读取 dist 目录失败', e.message);
        // 记住的仓库已经失效就别再死记住，退回手输
        if (staleFromStorage) {
          forget();
          showSetup();
          failEl.hidden = true;
        }
      });
  }

  function connect(spec) {
    var prev = target;
    target = spec;
    kRepo.textContent = label();
    setStatus('', '连接中');

    fetchFiles()
      .then(function (files) {
        repoErr.hidden = true;
        setupEl.hidden = true;
        filesEl.hidden = false;
        remember();
        return applyFiles(files);
      })
      .then(function () {
        setStatus('ok', label());
      })
      .catch(function (e) {
        target = prev;
        kRepo.textContent = prev.owner ? prev.owner + '/' + prev.repo : '—';
        repoErr.textContent = e.message;
        repoErr.hidden = false;
        setStatus('err', '连接失败');
      });
  }

  function tick() {
    var d = new Date();
    var p = function (n) { return n < 10 ? '0' + n : '' + n; };
    clock.textContent = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  document.getElementById('reload').addEventListener('click', function () { load(false); });

  repoSave.addEventListener('click', function () {
    var spec = parseSpec(repoInput.value);
    if (!spec) {
      repoErr.textContent = '看不懂这个地址，写成 owner/repo 试试';
      repoErr.hidden = false;
      return;
    }
    connect(spec);
  });

  repoInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') repoSave.click();
  });

  var fromQuery = parseSpec(new URLSearchParams(location.search).get('repo'));
  var fromStore = fromQuery ? null : recall();

  if (fromQuery) {
    target = fromQuery;
    load(false);
  } else if (fromStore) {
    target = fromStore;
    load(true);
  } else {
    var guessed = detect();
    if (guessed) {
      target = guessed;
      load(false);
    } else {
      showSetup();
    }
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
